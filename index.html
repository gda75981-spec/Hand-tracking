<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HandSpace 3D — Performance Edition</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #070b14;
  color: white;
  font-family: system-ui, sans-serif;
}
#scene {
  position: fixed;
  inset: 0;
}
#panel {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 5;
  width: min(290px, calc(100vw - 24px));
  padding: 14px;
  border: 1px solid #263650;
  border-radius: 14px;
  background: #101827ee;
  backdrop-filter: blur(8px);
}
h2 { margin: 0 0 5px; font-size: 19px; }
p { color: #a9bad2; font-size: 12px; margin: 5px 0 12px; }
button {
  padding: 10px 12px;
  border: 0;
  border-radius: 9px;
  background: #3182f6;
  color: white;
  font-weight: 700;
}
button:disabled { opacity: .5; }
#stop { background: #29364c; margin-left: 5px; }
#status { font-size: 12px; color: #72f5bd; margin-top: 10px; }
#stats {
  position: fixed;
  bottom: 12px;
  left: 12px;
  z-index: 5;
  padding: 8px 11px;
  background: #101827dd;
  border-radius: 8px;
  font: 12px monospace;
}
#camera {
  position: fixed;
  right: 12px;
  bottom: 12px;
  width: 110px;
  border-radius: 10px;
  transform: scaleX(-1);
  opacity: .65;
}
@media (max-width: 480px) {
  #panel { padding: 11px; }
  #camera { width: 85px; }
}
</style>
</head>

<body>
<div id="scene"></div>

<div id="panel">
  <h2>✋ HandSpace 3D</h2>
  <p>Optimized for mobile performance. Pinch your thumb and index finger to grab the cube.</p>
  <button id="start">Start camera</button>
  <button id="stop" disabled>Stop</button>
  <div id="status">Camera stopped</div>
</div>

<div id="stats">FPS: -- | Tracking: --</div>
<video id="camera" autoplay playsinline muted></video>

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { FilesetResolver, HandLandmarker } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const sceneElement = document.getElementById("scene");
const video = document.getElementById("camera");
const statusElement = document.getElementById("status");
const statsElement = document.getElementById("stats");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

let renderer, scene, camera, handTracker, stream;
let running = false;
let trackingBusy = false;
let lastTrackingTime = 0;
let lastVideoTime = -1;
let lastStatsTime = performance.now();
let renderedFrames = 0;
let fps = 0;
let lastHands = [];
let grabbed = false;
let previousHandPoint = null;

const TRACK_INTERVAL = 55; // About 18 tracking updates/second
const HAND_COUNT = 2;
const JOINTS_PER_HAND = 21;

const connections = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function makeScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#070b14");

  camera = new THREE.PerspectiveCamera(
    55, innerWidth / innerHeight, 0.1, 100
  );
  camera.position.set(0, 0, 8);

  renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance",
    alpha: false
  });

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  sceneElement.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xb8d8ff, 0x172036, 2));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(3, 5, 7);
  scene.add(light);

  // A small, low-polygon cube.
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 0.8, 0.8),
    new THREE.MeshStandardMaterial({
      color: "#3182f6",
      roughness: 0.5,
      metalness: 0.1
    })
  );
  cube.position.set(0, 0, 0);
  scene.add(cube);
  window.handCube = cube;

  // Static floor grid.
  const grid = new THREE.GridHelper(16, 32, 0x24456a, 0x17273e);
  grid.position.y = -2.5;
  scene.add(grid);

  // Reuse all joint geometry with instanced rendering.
  const jointGeometry = new THREE.SphereGeometry(0.055, 6, 5);
  const jointMaterial = new THREE.MeshBasicMaterial({
    color: "#63e8ff"
  });

  const joints = new THREE.InstancedMesh(
    jointGeometry, jointMaterial,
    HAND_COUNT * JOINTS_PER_HAND
  );
  joints.count = 0;
  scene.add(joints);
  window.handJoints = joints;

  // One dynamic line object for all hand bones.
  const boneCount = HAND_COUNT * connections.length;
  const boneGeometry = new THREE.BufferGeometry();
  const bonePositions = new Float32Array(boneCount * 2 * 3);

  boneGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(bonePositions, 3)
      .setUsage(THREE.DynamicDrawUsage)
  );

  const bones = new THREE.LineSegments(
    boneGeometry,
    new THREE.LineBasicMaterial({ color: "#45bfff" })
  );
  bones.frustumCulled = false;
  scene.add(bones);
  window.handBones = bones;

  window.addEventListener("resize", resize);
}

function resize() {
  if (!renderer || !camera) return;

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setPixelRatio(Math.min(devicePixelRatio, 1));
  renderer.setSize(innerWidth, innerHeight);
}

function mapLandmark(point) {
  // Convert camera coordinates into 3D scene coordinates.
  return new THREE.Vector3(
    (0.5 - point.x) * 8.5,
    (0.5 - point.y) * 5.2,
    THREE.MathUtils.clamp(-point.z * 3, -1.5, 1.5)
  );
}

function renderHands(hands) {
  const joints = window.handJoints;
  const bones = window.handBones;
  const cube = window.handCube;

  const dummy = new THREE.Object3D();
  const positions = bones.geometry.attributes.position.array;

  let jointIndex = 0;
  let boneIndex = 0;

  for (let h = 0; h < HAND_COUNT; h++) {
    const landmarks = hands[h];

    if (!landmarks) continue;

    const points = landmarks.map(mapLandmark);

    for (let i = 0; i < JOINTS_PER_HAND; i++) {
      dummy.position.copy(points[i]);
      dummy.updateMatrix();
      joints.setMatrixAt(jointIndex++, dummy.matrix);
    }

    for (const [a, b] of connections) {
      positions[boneIndex++] = points[a].x;
      positions[boneIndex++] = points[a].y;
      positions[boneIndex++] = points[a].z;

      positions[boneIndex++] = points[b].x;
      positions[boneIndex++] = points[b].y;
      positions[boneIndex++] = points[b].z;
    }

    // Thumb tip and index tip.
    const thumb = landmarks[4];
    const index = landmarks[8];

    const pinchDistance = Math.hypot(
      thumb.x - index.x,
      thumb.y - index.y,
      thumb.z - index.z
    );

    const isPinching = pinchDistance < 0.065;

    if (h === 0 && isPinching) {
      const midpoint = mapLandmark({
        x: (thumb.x + index.x) / 2,
        y: (thumb.y + index.y) / 2,
        z: (thumb.z + index.z) / 2
      });

      // Only start grabbing when the pinch begins near the cube.
      if (!grabbed && midpoint.distanceTo(cube.position) < 1.2) {
        grabbed = true;
      }

      if (grabbed) {
        cube.position.lerp(midpoint, 0.35);
        cube.material.color.set("#39e6a4");
      }
    } else if (h === 0 && grabbed) {
      grabbed = false;
      cube.material.color.set("#3182f6");
    }
  }

  joints.count = jointIndex;
  joints.instanceMatrix.needsUpdate = true;

  bones.geometry.attributes.position.needsUpdate = true;
  bones.geometry.setDrawRange(0, boneIndex / 3);
}

async function initializeTracker() {
  statusElement.textContent = "Loading hand tracker...";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handTracker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.55,
    minHandPresenceConfidence: 0.55,
    minTrackingConfidence: 0.55
  });
}

async function startCamera() {
  if (running) return;

  startButton.disabled = true;
  statusElement.textContent = "Starting camera...";

  try {
    if (!renderer) makeScene();
    if (!handTracker) await initializeTracker();

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 480 },
        height: { ideal: 360 },
        frameRate: { ideal: 30, max: 30 }
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    startButton.disabled = true;
    stopButton.disabled = false;
    statusElement.textContent = "Camera active — show your hands";

    requestAnimationFrame(renderLoop);
  } catch (error) {
    console.error(error);
    statusElement.textContent =
      "Could not start camera. Check permissions and HTTPS.";
    startButton.disabled = false;
  }
}

function stopCamera() {
  running = false;
  grabbed = false;
  lastHands = [];

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;

  if (handTracker) {
    // Keep the tracker loaded so restarting is quicker.
  }

  if (window.handJoints) window.handJoints.count = 0;
  if (window.handBones) window.handBones.geometry.setDrawRange(0, 0);

  if (window.handCube) {
    window.handCube.material.color.set("#3182f6");
  }

  startButton.disabled = false;
  stopButton.disabled = true;
  statusElement.textContent = "Camera stopped";
}

function renderLoop(now) {
  if (!running) return;

  // Keep rendering independent from the hand tracking schedule.
  renderer.render(scene, camera);
  renderedFrames++;

  // Run inference only when enough time has passed.
  if (
    !trackingBusy &&
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime &&
    now - lastTrackingTime >= TRACK_INTERVAL
  ) {
    trackingBusy = true;
    lastTrackingTime = now;
    lastVideoTime = video.currentTime;

    try {
      const result = handTracker.detectForVideo(video, now);
      lastHands = result.landmarks || [];
      renderHands(lastHands);

      statusElement.textContent = lastHands.length
        ? `${lastHands.length} hand(s) detected`
        : "Show your hands to the camera";
    } catch (error) {
      console.error("Tracking error:", error);
    } finally {
      trackingBusy = false;
    }
  }

  if (now - lastStatsTime >= 1000) {
    fps = renderedFrames;
    statsElement.textContent =
      `FPS: ${fps} | Tracking: ${Math.round(1000 / TRACK_INTERVAL)}/s`;

    renderedFrames = 0;
    lastStatsTime = now;
  }

  requestAnimationFrame(renderLoop);
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopCamera);

makeScene();
renderer.render(scene, camera);

window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
